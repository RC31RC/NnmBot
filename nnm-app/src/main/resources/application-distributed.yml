nnm:
  distributed:
    enabled: true
    # 管理端异步业务任务状态的保留配置，与下方 RDT 定时任务执行记录不是一回事。
    task-retention: 2h
    task-timeout: 30m
    task-poll-interval: 2s
    max-task-subscriptions: 128
    owner-lease: 30s
    reconcile-interval: 10s
    # 机器人入站消息的防重复处理标记，不是 RDT Stream 消息的保留时长。
    message-dedup-retention: 1d
    world-state-retention: 2d
    discovery-timeout: 60s

spring:
  data:
    redis:
      repositories:
        enabled: false
      # 本地开发默认连接本机 Redis；远程 Redis 必须通过环境变量显式配置。
      host: ${NNM_REDIS_HOST:123.206.232.72}
      port: ${NNM_REDIS_PORT:6379}
      database: ${NNM_REDIS_DATABASE:0}
      password: ${NNM_REDIS_PASSWORD:6379736}
      # Redisson 命令超时需要覆盖正常网络抖动；锁获取失败时仍会保留原始 Redis 超时原因。
      timeout: 10s

rdt:
  enabled: ${nnm.distributed.enabled}
  client:
    threads: 2
    netty-threads: 2
    connections: 12
    subscription-connections: 4
    # 与 spring.data.redis.timeout 保持一致，避免官方 Redisson 配置覆盖 RDT 客户端超时。
    timeout: 10s
    connect-timeout: 10s
    retry-attempts: 3
    retry-interval: 1s
    ping-connection-interval: 30s
  instance:
    lease: ${nnm.distributed.owner-lease}
    renew-interval: ${nnm.distributed.reconcile-interval}
  namespace: nnmbot:${APP_ENV:dev}
  # 同时运行的实例必须配置不同且重启后保持稳定的标识。
  instance-id: ${INSTANCE_ID:local-1}
  cache:
    local-enabled: false
  queue:
    visibility-timeout: 2m
    max-attempts: 5
    auto-delete-after-ack: true
    dead-letter-ttl: 30d
    # Stream 在 ACK 自动删除之外的最终保留边界，防止离线消费组导致 Redis 无限增长。
    # 超出边界的长期未确认消息可能被裁剪，消费者必须保证业务幂等。
    stream-retention: 7d
    stream-max-length: 10000
  schedule:
    workers: 2
    remote-enabled: false
    # 任务 ID 是稳定身份；表达式、周期或时区变化时按新定义刷新，而不是更换任务 ID。
    definition-change-policy: UPDATE
    # 每条定时任务执行记录独立过期；保持 RDT 原默认值，只对新写入的记录生效。
    result-ttl: ${NNM_RDT_SCHEDULE_RESULT_TTL:7d}
