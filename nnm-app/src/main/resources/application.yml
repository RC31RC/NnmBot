server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: NnmBot
  threads:
    # Tomcat 和 Spring 默认异步执行器使用虚拟线程；CPU 密集型任务仍显式使用平台线程池。
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  thymeleaf:
    # 业务模板来自数据库 HTML，不使用 classpath:/templates/ 下的资源模板。
    check-template-location: false
  config:
    import:
      - optional:classpath:application-bot.yml
      - classpath:application-distributed.yml
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    driver-class-name: org.postgresql.Driver
#    url: jdbc:postgresql://123.206.232.72:5432/nnmbot?currentSchema=nnmbot,public
    url: jdbc:postgresql://127.0.0.1:5432/nnmbot?currentSchema=nnmbot,public
    username: postgres
    password: root
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: nnmbot
        format_sql: true
        query.fail_on_pagination_over_collection_fetch: true
    show-sql: false
  cache:
    # 当前实际 CacheManager 由 cache2k 配置类显式提供；以下 Caffeine 配置仅保留作评估回退，
    # 不会覆盖显式 CacheManager Bean。
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 7200
  # 访问期间自动续签；连续 30 天没有访问才失效。
  active-timeout: 2592000
  is-concurrent: true
  is-share: false
  max-login-count: 5
  is-read-cookie: false
  is-read-body: false
  is-write-header: false

logging:
  level:
    com.nnm.bot: INFO
    com.nnm.bot.common.http.HttpClient: INFO
    com.mikuac.shiro: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

nnm:
  web:
    cors:
      # 精确来源用于本机开发；来源模式覆盖常见私有局域网地址和任意开发端口。
      allowed-origins: ${NNM_WEB_CORS_ALLOWED_ORIGINS:http://localhost:3006,http://127.0.0.1:3006}
      allowed-origin-patterns: ${NNM_WEB_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*],http://10.*:[*],http://192.168.*:[*],http://172.16.*:[*],http://172.17.*:[*],http://172.18.*:[*],http://172.19.*:[*],http://172.20.*:[*],http://172.21.*:[*],http://172.22.*:[*],http://172.23.*:[*],http://172.24.*:[*],http://172.25.*:[*],http://172.26.*:[*],http://172.27.*:[*],http://172.28.*:[*],http://172.29.*:[*],http://172.30.*:[*],http://172.31.*:[*]}
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: false
      max-age: 3600
  ocr:
    # OCR native 库只在后续紫卡分析启用时打开，避免普通启动加载模型。
    enabled: true
    max-input-bytes: 8388608
    max-image-pixels: 25000000
    enhanced-recognition: true
    max-side-length: 960
    box-score-threshold: 0.6
    box-threshold: 0.3
    un-clip-ratio: 2.5
  admin:
    bootstrap:
      enabled: true
      username: admin
      password: admin123
  http:
    connect-timeout: 10s
    read-timeout: 30s
    max-attempts: 3
    retry-backoff: 500ms
    retry-max-backoff: 5s
    slow-request-threshold: 3s
    payload-logging-enabled: false
    max-payload-log-length: 2048
    # 单位为字节：普通响应 16 MiB，流式下载 512 MiB。
    max-response-body-bytes: 16777216
    max-download-bytes: 536870912
    request-id-header: X-Request-Id
    request-id-mdc-key: requestId
    trace-header: traceparent
    trace-mdc-key: traceparent
    metrics-enabled: true
    trust-all-certs: false
  executor:
    # 通用 I/O 任务使用虚拟线程，数值限制的是同时运行的业务任务数。
    application-concurrency: 64
    # 独立虚拟线程执行器在提交入口限流，不创建无限等待的发现线程。
    discovery-concurrency: 4
    # 建连任务与业务任务隔离，防止业务等待握手时耗尽同一执行器的许可。
    connection-concurrency: 4
    # 下载和解析隔离于父刷新任务；工作线程不访问数据库，兼顾 4GB 内存预算。
    community-source-concurrency: 2
    community-source-queue-capacity: 8
    task:
      # CPU 线程数默认取 JVM 可见核心数，可用 core-size / max-size 显式覆盖。
      queue-capacity: 100
      keep-alive: 60s
    scheduler:
      pool-size: 2
    await-termination: 30s
