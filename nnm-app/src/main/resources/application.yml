server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: NnmBot
  config:
    import: optional:classpath:application-bot.yml
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/nnmbot?currentSchema=nnmbot,public
    username: nnmbot
    password: nnmbot
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: nnmbot
        query.fail_on_pagination_over_collection_fetch: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    baseline-on-migrate: true
  cache:
    # 当前实际 CacheManager 为 cache2k，Caffeine 仅保留为评估回退配置。
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 7200
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  max-login-count: 5
  is-read-cookie: false
  is-read-body: false
  is-write-header: false

logging:
  level:
    com.nnm.bot: DEBUG
    com.mikuac.shiro: INFO
    org.hibernate.SQL: WARN
    org.springframework: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

nnm:
  admin:
    bootstrap:
      enabled: true
      username: admin
      password: admin123
  http:
    connect-timeout: 10s
    read-timeout: 30s
    max-attempts: 3
    retry-backoff: 500ms
    retry-max-backoff: 5s
    slow-request-threshold: 3s
    payload-logging-enabled: false
    max-payload-log-length: 2048
    trust-all-certs: false
  executor:
    task:
      core-size: 2
      max-size: 8
      queue-capacity: 100
      keep-alive: 60s
    scheduler:
      pool-size: 2
    await-termination: 30s
