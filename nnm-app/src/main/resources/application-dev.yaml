spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/nnm-dev;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: false

logging:
  level:
    com.nnm.bot: DEBUG
    org.hibernate.SQL: DEBUG
