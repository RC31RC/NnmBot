          - source-code: warframe-info-api:routes/arbitrationEssence.js
            url: https://raw.githubusercontent.com/mmxd12/warframe-info-api/main/routes/arbitrationEssence.js
        arbitration_schedule:
          - source-code: browse.wf:arbys.txt
            url: https://browse.wf/arbys.txt
        term:
          - source-code: kingprimes:warframe/term.json
            urls:
              - https://testingcf.jsdelivr.net/gh/KingPrimes/DataSource@latest/warframe/term.json
              - https://jsd.onmicrosoft.cn/gh/KingPrimes/DataSource@latest/warframe/term.json
              - https://cdn.jsdelivr.net/gh/KingPrimes/DataSource@latest/warframe/term.json
        alias:
