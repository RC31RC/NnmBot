# 所有机器人渠道都按“协议 -> 渠道实例”组织。
# connection 保存连接凭据；runtime 保存重连等运行策略；实时连接状态由内存注册表维护。
nnm:
  bot:
    channels:
      onebot:
        enabled: false
        instances:
          - id: personal-qq
            # 一个正向 WebSocket 可承载多个 QQ；按 OneBot 事件中的 self_id 分流。
            # 配置明确账号时仅接受这些 QQ；不确定账号时可改为 account-ids: [] 并开启自动发现。
            account-ids:
              - "123456789"
            auto-discover-accounts: false
            enabled: true
            connection:
              url: ${ONEBOT_WS_URL:ws://123.206.232.72:3001}
              access-token: ${ONEBOT_ACCESS_TOKEN:QsqrA8oIMJL9tnE-RMaLlZ-2mjjrfZKkyrBfdko65-g}
            runtime:
              reconnect-interval: 5s
        # 同地址、同 Token 的多个实例会复用一条 WebSocket；不同地址才需要新增连接实例。
      qq-official:
        enabled: false
        instances:
          - id: official-bot
            enabled: true
            connection:
              app-id: ""
              client-secret: ""
              token-url: https://bots.qq.com/app/getAppAccessToken
              api-base-url: https://api.sgroup.qq.com
              gateway-url: ""
            runtime:
              intents: 100663296
              gateway-connect-timeout: 10s
              reconnect-delay: 5s
  warframe:
    polling:
      enabled: true
      interval: 200m
    api:
      world-state-url: https://api.warframe.com/cdn/worldState.php
      market-base-url: https://api.warframe.market/v1
      language: zh
      platform: pc
    cache:
      world-state:
        capacity: 1
      metadata:
        capacity: 64
        expire-after-write: 6h
      translations:
        capacity: 16
        expire-after-write: 12h
      data-source-tag:
        capacity: 8
        expire-after-write: 2m

# Shiro 只提供 OneBot 协议解析；多地址连接由 NnmBot 自己管理。
shiro:
  ws:
    access-token: ${ONEBOT_ACCESS_TOKEN:QsqrA8oIMJL9tnE-RMaLlZ-2mjjrfZKkyrBfdko65-g}
    server:
      enable: false
      url: /ws/shiro
    client:
      enable: false

render:
  engine: auto
  # OpenHTMLToPDF 会按顺序选择第一个存在的中文字体。
  # fonts:
  #   paths:
  #     - /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
  plugins:
    enabled: true
    external-enabled: false
    directory: ./plugin
  playwright:
    chromium-args:
      - --no-sandbox
      - --disable-gpu
