# Warframe 业务配置按子系统绑定；动态快照仅保存在各实例内存中。
# forum.storage 管理附件，pull 管理上游来源和拉取周期；未在此覆盖的 query/cache 配置使用属性类默认值。
# 上游地址和刷新周期支持环境变量覆盖；HTTP 通用策略使用 nnm.http 配置。
# 人工白名单来源通过管理端配置，上传和拉取统一审核。
nnm:
  warframe:
    forum:
      public-base-url: ${NNM_WARFRAME_FORUM_PUBLIC_BASE_URL:http://localhost:3006}
      storage:
        # 存储连接统一在 application.yml 的 nnm.storage；这里仅管理论坛附件行为。
        max-file-bytes: ${NNM_WARFRAME_FORUM_MAX_FILE_BYTES:52428800}
    pull:
      polling:
        interval: ${NNM_WARFRAME_POLLING_INTERVAL:2m}
      dataset:
        source-mode: ${NNM_WARFRAME_DATASET_SOURCE_MODE:REMOTE}
        # 可选；CDN 按 tag 逐文件下载失败后，GitHub Contents API 作为回退来源。
        github-token: ${NNM_WARFRAME_DATASET_GITHUB_TOKEN:}
        # 清单和业务文件均保存 gzip 原件，仅限制单个压缩文件大小。
        max-file-bytes: ${NNM_WARFRAME_DATASET_MAX_FILE_BYTES:20000000}
        local-data-directory: ${NNM_WARFRAME_DATASET_DIRECTORY:${user.dir}/../warframe-datasource-nnm/data/latest}
        local-ref: ${NNM_WARFRAME_DATASET_LOCAL_REF:local}
        local-commit: ${NNM_WARFRAME_DATASET_LOCAL_COMMIT:}
        local-version-timeout: ${NNM_WARFRAME_DATASET_LOCAL_VERSION_TIMEOUT:5s}
      market-api:
        version: ${NNM_WARFRAME_MARKET_API_VERSION:v2}
        api-key: ${NNM_WARFRAME_MARKET_API_KEY:}
        user-agent: ${NNM_WARFRAME_MARKET_USER_AGENT:NnmBot/1.0}
      bounty-cycle:
        enabled: ${NNM_WARFRAME_BOUNTY_CYCLE_ENABLED:true}
      arbitration:
        # retry-interval 驱动定时检查与失败重试；refresh-interval 到期才请求上游。
        url: ${NNM_WARFRAME_ARBITRATION_URL:https://browse.wf/arbys.txt}
        refresh-interval: ${NNM_WARFRAME_ARBITRATION_REFRESH_INTERVAL:10d}
        retry-interval: ${NNM_WARFRAME_ARBITRATION_RETRY_INTERVAL:1m}
        data-window: ${NNM_WARFRAME_ARBITRATION_DATA_WINDOW:20d}
        max-records: ${NNM_WARFRAME_ARBITRATION_MAX_RECORDS:50000}
        max-response-bytes: ${NNM_WARFRAME_ARBITRATION_MAX_RESPONSE_BYTES:5242880}
      kuva-missions:
        interval: ${NNM_WARFRAME_KUVA_MISSIONS_INTERVAL:2m}
        url: ${NNM_WARFRAME_KUVA_MISSIONS_URL:https://10o.io/kuvalog.json}
        max-bytes: ${NNM_WARFRAME_KUVA_MISSIONS_MAX_BYTES:4194304}
      steel-incursions:
        url: ${NNM_WARFRAME_STEEL_INCURSIONS_URL:https://browse.wf/sp-incursions.txt}
        refresh-interval: ${NNM_WARFRAME_STEEL_INCURSIONS_REFRESH_INTERVAL:10d}
        retry-interval: ${NNM_WARFRAME_STEEL_INCURSIONS_RETRY_INTERVAL:1m}
        data-window: ${NNM_WARFRAME_STEEL_INCURSIONS_DATA_WINDOW:5d}
        max-response-bytes: ${NNM_WARFRAME_STEEL_INCURSIONS_MAX_RESPONSE_BYTES:5242880}
