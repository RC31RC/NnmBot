server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: NnmBot

  profiles:
    active: dev

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    baseline-on-migrate: true

  cache:
    # Retained temporarily as the Caffeine fallback configuration.
    # WarframeCacheConfiguration supplies the active cache2k CacheManager.
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

# Sa-Token authentication
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 7200
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  max-login-count: 5
  is-read-cookie: false
  is-read-body: false
  is-write-header: false

# OneBot Configuration
shiro:
  ws:
    server:
      url: /ws/shiro
      enable: true
    client:
      enable: false
      url: ws://localhost:3001
      reconnect-interval: 5000

# Render engine configuration
render:
  engine: auto
  playwright:
    chromium-args:
      - --no-sandbox
      - --disable-gpu

# Logging
logging:
  level:
    com.nnm.bot: INFO
    com.mikuac.shiro: INFO
    org.hibernate.SQL: WARN
    org.springframework: INFO

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

nnm:
  http:
    connect-timeout: 10s
    read-timeout: 30s
    max-attempts: 3
    retry-backoff: 500ms
    retry-max-backoff: 5s
    trust-all-certs: false
  executor:
    task:
      core-size: 2
      max-size: 8
      queue-capacity: 100
      keep-alive: 60s
    scheduler:
      pool-size: 2
    await-termination: 30s
  warframe:
    polling:
      enabled: true
      interval: 2m
    api:
      world-state-url: https://api.warframestat.us/pc
      market-base-url: https://api.warframe.market/v1
      language: zh
      platform: pc
    cache:
      world-state:
        capacity: 1
      metadata:
        capacity: 64
        expire-after-write: 6h
      translations:
        capacity: 16
        expire-after-write: 12h
      data-source-tag:
        capacity: 8
        expire-after-write: 2m
