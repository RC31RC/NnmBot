server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: NnmBot

  profiles:
    active: dev

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.query.fail_on_pagination_over_collection_fetch: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    baseline-on-migrate: true

  cache:
    # 暂时保留作为 Caffeine 回退配置。
    # WarframeCacheConfiguration 提供当前生效的 cache2k CacheManager。
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

# Sa-Token 认证
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 7200
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  max-login-count: 5
  is-read-cookie: false
  is-read-body: false
  is-write-header: false

# OneBot 配置
shiro:
  ws:
    access-token: ${ONEBOT_ACCESS_TOKEN:QsqrA8oIMJL9tnE-RMaLlZ-2mjjrfZKkyrBfdko65-g}
    server:
      url: /ws/shiro
      enable: false
    client:
      enable: true
      url: ${ONEBOT_WS_URL:ws://123.206.232.72:3001}
      reconnect-interval: 5

# 渲染引擎配置
render:
  engine: auto
  plugins:
    enabled: true
    external-enabled: false
    directory: ./plugin
    # provider: custom-renderer（可选，自定义渲染提供者标识）
  playwright:
    chromium-args:
      - --no-sandbox
      - --disable-gpu

# 日志
logging:
  level:
    com.nnm.bot: INFO
    com.mikuac.shiro: INFO
    org.hibernate.SQL: WARN
    org.springframework: INFO

# Actuator 运行监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

nnm:
  bot:
    qq-official:
      enabled: ${QQ_BOT_ENABLED:false}
      app-id: ${QQ_BOT_APP_ID:}
      client-secret: ${QQ_BOT_CLIENT_SECRET:}
      token-url: https://bots.qq.com/app/getAppAccessToken
      api-base-url: https://api.sgroup.qq.com
      intents: 100663296
      gateway-connect-timeout: 10s
      reconnect-delay: 5s
  http:
    connect-timeout: 10s
    read-timeout: 30s
    max-attempts: 3
    retry-backoff: 500ms
    retry-max-backoff: 5s
    slow-request-threshold: 3s
    payload-logging-enabled: false
    max-payload-log-length: 2048
    trust-all-certs: false
  executor:
    task:
      core-size: 2
      max-size: 8
      queue-capacity: 100
      keep-alive: 60s
    scheduler:
      pool-size: 2
    await-termination: 30s
  warframe:
    polling:
      enabled: true
      interval: 200m
    api:
      world-state-url: https://api.warframe.com/cdn/worldState.php
      market-base-url: https://api.warframe.market/v1
      language: zh
      platform: pc
    cache:
      world-state:
        capacity: 1
      metadata:
        capacity: 64
        expire-after-write: 6h
      translations:
        capacity: 16
        expire-after-write: 12h
      data-source-tag:
        capacity: 8
        expire-after-write: 2m
