<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        * { box-sizing: border-box; }
        body {
            width: 560px;
            margin: 0;
            padding: 24px;
            color: #17202a;
            background: #f4f7fb;
            font-family: "Noto Sans SC", Arial, sans-serif;
        }
        .panel {
            padding: 24px;
            border: 1px solid #dbe3ee;
            border-radius: 14px;
            background: #ffffff;
        }
        .title {
            margin: 0 0 6px;
            color: #172b4d;
            font-size: 24px;
            font-weight: 700;
        }
        .subtitle {
            margin: 0 0 20px;
            color: #6b778c;
            font-size: 13px;
        }
        .grid {
            display: table;
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }
        .row { display: table-row; }
        .label, .value {
            display: table-cell;
            padding: 11px 12px;
            border-top: 1px solid #edf1f5;
            border-bottom: 1px solid #edf1f5;
            font-size: 14px;
        }
        .label {
            width: 36%;
            color: #6b778c;
            border-left: 1px solid #edf1f5;
            border-radius: 8px 0 0 8px;
        }
        .value {
            color: #17202a;
            font-weight: 600;
            text-align: right;
            border-right: 1px solid #edf1f5;
            border-radius: 0 8px 8px 0;
        }
        .ok {
            color: #14804a;
        }
    </style>
</head>
<body>
<section class="panel">
    <h1 class="title">NnmBot 运行状态</h1>
    <p class="subtitle">服务运行信息</p>
    <div class="grid">
        <div class="row">
            <div class="label">状态</div>
            <div class="value ok">正常运行</div>
        </div>
        <div class="row">
            <div class="label">机器人账号</div>
            <div class="value" th:text="${accountId}">unknown</div>
        </div>
        <div class="row">
            <div class="label">会话类型</div>
            <div class="value" th:text="${scope}">unknown</div>
        </div>
        <div class="row">
            <div class="label">运行时长</div>
            <div class="value" th:text="${uptime}">00:00:00</div>
        </div>
        <div class="row">
            <div class="label">JVM</div>
            <div class="value" th:text="${javaVersion}">21</div>
        </div>
        <div class="row">
            <div class="label">内存</div>
            <div class="value" th:text="${memory}">0 MiB / 0 MiB</div>
        </div>
        <div class="row">
            <div class="label">插件数量</div>
            <div class="value" th:text="${pluginCount}">0</div>
        </div>
    </div>
</section>
</body>
</html>
